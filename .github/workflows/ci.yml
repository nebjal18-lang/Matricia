name: Matricia CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:phase00
      - run: node --experimental-strip-types scripts/validate-boundaries.ts
      - run: pnpm lint
      - run: pnpm typecheck
      # Quote FormData unit recipes use a real browser. Install the version
      # matching Playwright instead of relying on an Ubuntu Chromium wrapper.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm -r --workspace-concurrency=1 test --maxWorkers=2
      - run: pnpm test:integration
      - run: pnpm test:tooling
      - run: pnpm no-placeholders
      - run: pnpm build
        env:
          # Hermetic build bindings belong only to the build. Unit tests inject
          # their dependencies; a fake service key must not imply a live vault.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-local-publishable-key-not-a-secret
          NEXT_PUBLIC_APP_URL: https://matricia.example
          SUPABASE_SERVICE_ROLE_KEY: ci-local-service-role-key-not-a-secret

  database:
    runs-on: ubuntu-latest
    # Replay the complete migration inventory, then test a separately identified
    # disposable clone. Reset is restricted to this ephemeral CI job.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - run: node scripts/run-isolated-db-tests.mjs
        env:
          DB_TEST_SOURCE_KIND: clean-local-supabase
          DB_TEST_SOURCE_PROJECT: Matricia
          DB_TEST_RELEASE: '1'

  browser-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-local-publishable-key-not-a-secret
      NEXT_PUBLIC_APP_URL: https://matricia.example
      PLAYWRIGHT_VIDEO: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-acceptance
          path: artifacts/test-results/acceptance/*-summary.json
          if-no-files-found: error
